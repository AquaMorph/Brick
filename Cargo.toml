[workspace]
resolver = "3"
members = ["crates/brick", "crates/brick-avfoundation", "crates/brick-edsdk", "crates/brick-v4l2", "xtask"]

[workspace.package]
version = "0.1.0"
authors = ["Christian Colglazier"]
edition = "2024"
license = "MIT"
repository = "https://github.com/AquaMorph/Brick"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "forbid"

# Decoding and encoding camera images is far too slow for development without
# optimizing dependencies.
[profile.dev.package."*"]
opt-level = 2

# Converts every live view frame pixel by pixel.
[profile.dev.package.brick-v4l2]
opt-level = 2
