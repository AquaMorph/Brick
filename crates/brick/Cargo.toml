[package]
name = "brick"
description = "Stop motion animation for DSLRs and webcams"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "wayland",
    "wgpu",
    "x11",
] }
egui_extras = { version = "0.37", default-features = false, features = ["image", "file"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.3"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
